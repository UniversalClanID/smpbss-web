<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<base href="/kisi/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kisi-Kisi SASBK Gasal Kelas 7 | SMP Brawijaya Smart School</title>
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root{--bg:#f4f6fb;--bg2:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ac:#6366f1;--sh:0 10px 30px -12px rgba(15,23,42,.18)}
[data-t=dark]{--bg:#0b1020;--bg2:#131a30;--tx:#e8ecf8;--mut:#93a0bd;--bd:#232c4a;--sh:0 10px 30px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 10% -5%,#6366f133,transparent),radial-gradient(500px 400px at 95% 5%,#ec489933,transparent),radial-gradient(500px 500px at 50% 110%,#10b98122,transparent)}
.wrap{max-width:1180px;margin:auto;padding:0 18px}
nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--bd)}
nav .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{font-weight:800;letter-spacing:-.3px;display:flex;gap:8px;align-items:center;cursor:pointer}
.logo i{font-style:normal;background:linear-gradient(135deg,#6366f1,#ec4899);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
.sp{flex:1}
.btn{border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:12px;padding:8px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-1px);border-color:var(--ac)}
.btn.p{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:0}
.hero{padding:54px 0 26px;text-align:center}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--bg2);border:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--mut)}
h1{font-size:clamp(30px,6vw,56px);line-height:1.05;letter-spacing:-1.5px;margin:16px 0 12px;font-weight:900}
h1 span{background:linear-gradient(90deg,#6366f1,#ec4899,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:620px;margin:auto;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0}
.st{background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.st b{font-size:28px;font-weight:800;display:block}
.st small{color:var(--mut);font-weight:600}
.sr{display:flex;gap:10px;margin:8px 0 18px;flex-wrap:wrap}
.in{flex:1;min-width:200px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:14px;padding:13px 16px;font:500 15px inherit;font-family:inherit;outline:none;transition:.2s}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 4px #6366f126}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding-bottom:60px}
.card{position:relative;background:var(--bg2);border:1px solid var(--bd);border-radius:22px;padding:20px;cursor:pointer;overflow:hidden;box-shadow:var(--sh);transition:.25s;animation:up .5s both}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.card:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--c);opacity:.12;transition:.3s}
.card:hover{transform:translateY(-6px)}
.card:hover:after{transform:scale(1.5);opacity:.18}
.ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--c) 16%,transparent)}
.card h3{margin:14px 0 4px;font-size:19px;letter-spacing:-.3px}
.card p{color:var(--mut);font-size:13px}
.bar{display:flex;height:8px;border-radius:9px;overflow:hidden;margin-top:14px;background:var(--bd)}
.bar i{display:block;height:100%}
.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;font-weight:700;color:var(--mut)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:center;gap:16px;padding:30px 0 10px;flex-wrap:wrap}
.head .ic{width:64px;height:64px;font-size:32px}
.head h2{font-size:clamp(24px,4vw,36px);letter-spacing:-1px}
.head p{color:var(--mut);font-size:14px;margin-top:4px}
.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:99px;padding:7px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;transition:.2s}
.chip.on{background:var(--c,var(--ac));color:#fff;border-color:transparent}
.dist{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 12px}
.dc{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.dc b{display:block;font-size:20px}
.dc small{color:var(--mut);font-weight:700;font-size:11px}
.dc i{display:block;height:5px;border-radius:5px;margin-top:6px}
.list{display:grid;gap:12px;padding-bottom:70px}
.it{background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:52px 1fr;gap:14px;box-shadow:var(--sh);animation:up .4s both}
.no{width:52px;height:52px;border-radius:15px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}
.it h4{font-size:15px;line-height:1.5;font-weight:600}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.tag.g{background:var(--bd);color:var(--mut)}
details{margin-top:10px}
summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--mut);list-style:none}
summary::-webkit-details-marker{display:none}
details div{margin-top:8px;font-size:13px;color:var(--mut);line-height:1.6;padding:10px 12px;background:var(--bg);border-radius:12px}
.imgs{display:grid;gap:14px;padding-bottom:70px}
.imgs img{width:100%;border-radius:16px;border:1px solid var(--bd);background:#fff;cursor:zoom-in}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;width:46px;height:46px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:18px;cursor:pointer;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.3s}
.fab.s{opacity:1;pointer-events:auto}
.lb{position:fixed;inset:0;background:#000d;z-index:50;display:none;overflow:auto;padding:12px}
.lb.o{display:block}
.lb img{width:min(1400px,100%);display:block;margin:auto;border-radius:10px}
.hl{background:#fde04766;border-radius:3px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:30px 0 40px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.dist{grid-template-columns:repeat(3,1fr)}.it{grid-template-columns:42px 1fr;padding:14px}.no{width:42px;height:42px;font-size:16px;border-radius:12px}.hide-m{display:none}}
@media print{nav,.sr,.tabs,.fab,footer{display:none}body:before{display:none}.it{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<nav><div class="wrap"><div class="logo" onclick="go('')"><i>📚</i><span>Kisi-Kisi <span class="hide-m">SASBK</span></span></div><div class="sp"></div><a class="btn hide-m" href="../">🗓️ Jadwal</a><button class="btn" id="th">🌙</button></div></nav>
<main class="wrap" id="app"></main>
<footer>SMP Brawijaya Smart School · Tahun Pelajaran 2026/2027 · Kelas VII</footer>
<button class="fab" id="fab">↑</button>
<div class="lb" id="lb"><img id="lbi" alt=""></div>
<script src="data.js"></script>
<script>
const D=window.KISI,A=document.getElementById('app'),LV=['C1','C2','C3','C4','C5','C6'],LC=['#22c55e','#06b6d4','#3b82f6','#8b5cf6','#f59e0b','#ef4444'],LN=['Mengingat','Memahami','Menerapkan','Menganalisis','Mengevaluasi','Mencipta'];
const lv=x=>{const m=/C\s?([1-6])/i.exec(x.level||'');return m?'C'+m[1]:''};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cnt=s=>{const r={};LV.forEach(l=>r[l]=0);s.items.forEach(i=>{const l=lv(i);if(l)r[l]++});return r};
const total=D.reduce((a,s)=>a+s.items.length,0);
const st={q:'',l:'',t:'',m:''};
function hl(t,q){t=esc(t);if(!q)return t;const r=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return t.replace(r,'<span class="hl">$1</span>')}
function home(){
document.title='Kisi-Kisi SASBK Gasal Kelas 7 | SMP Brawijaya Smart School';
A.innerHTML=`<section class="hero"><span class="pill">✨ Tahun Pelajaran 2026/2027</span><h1>Kisi-Kisi <span>SASBK Gasal</span><br>Kelas 7</h1><p>Semua kisi-kisi mata pelajaran dalam satu tempat. Cari indikator, filter level kognitif, dan unduh PDF aslinya.</p></section>
<div class="stats"><div class="st"><b data-n="${D.length}">0</b><small>Mata Pelajaran</small></div><div class="st"><b data-n="${total}">0</b><small>Indikator Soal</small></div><div class="st"><b data-n="${D.reduce((a,s)=>a+(s.pdf?1:0),0)}">0</b><small>File PDF</small></div><div class="st"><b>VII</b><small>Kelas</small></div></div>
<div class="sr"><input class="in" id="gs" placeholder="🔍 Cari indikator di semua mapel…" autocomplete="off"></div>
<div id="gr" class="grid"></div>`;
const gr=document.getElementById('gr');
D.forEach((s,i)=>{const c=cnt(s),n=s.items.length||1;const b=LV.map((l,k)=>`<i style="width:${c[l]/n*100}%;background:${LC[k]}"></i>`).join('');
gr.insertAdjacentHTML('beforeend',`<div class="card" style="--c:${s.warna};animation-delay:${i*60}ms" onclick="go('${s.id}')"><div class="ic">${s.ikon}</div><h3>${s.nama}</h3><p>${esc(s.penyusun)||'Kisi-kisi soal'}</p><div class="bar">${b}</div><div class="meta"><span>${s.items.length?s.items.length+' indikator':s.gambar.length+' halaman'}</span><span>Buka →</span></div></div>`)});
document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n;let v=0;const t=setInterval(()=>{v+=Math.max(1,Math.ceil(n/30));if(v>=n){v=n;clearInterval(t)}e.textContent=v},25)});
const gs=document.getElementById('gs');
gs.oninput=()=>{const q=gs.value.trim().toLowerCase();if(q.length<2){gr.style.display='';const x=document.getElementById('res');if(x)x.remove();return}
gr.style.display='none';let x=document.getElementById('res');if(!x){x=document.createElement('div');x.id='res';x.className='list';A.appendChild(x)}
let h='',n=0;D.forEach(s=>s.items.forEach(i=>{if(n<60&&(i.indikator+' '+i.materi+' '+i.kompetensi).toLowerCase().includes(q)){n++;h+=item(s,i,q,true)}}));
x.innerHTML=h||'<div class="empty">Tidak ada hasil 😕</div>'}
}
function item(s,i,q,showS){const l=lv(i);
return `<div class="it" style="--c:${s.warna}"><div class="no">${esc(i.no)}</div><div><h4>${hl(i.indikator,q)}</h4><div class="tg">${showS?`<span class="tag">${s.ikon} ${s.nama}</span>`:''}${i.materi?`<span class="tag g">${hl(i.materi,q)}</span>`:''}${l?`<span class="tag" style="--c:${LC[+l[1]-1]}">${l} · ${LN[+l[1]-1]}</span>`:''}${i.tingkat?`<span class="tag g">${esc(i.tingkat)}</span>`:''}${i.bentuk?`<span class="tag g">${esc(i.bentuk)}</span>`:''}${i.btk?`<span class="tag g">BTK ${esc(i.btk)}</span>`:''}</div>${i.kompetensi?`<details><summary>Lihat kompetensi ▾</summary><div>${i.kd&&i.kd!==i.no?`<b>KD ${esc(i.kd)}</b> · `:''}${esc(i.kompetensi)}${i.sumber?`<br><br>📚 ${esc(i.sumber)}`:''}</div></details>`:''}</div></div>`}
function subj(id){
const s=D.find(x=>x.id===id);if(!s)return home();
document.title=s.nama+' | Kisi-Kisi SASBK Kelas 7';
const c=cnt(s);
const mats=[...new Set(s.items.map(i=>i.materi).filter(Boolean))];
const tks=[...new Set(s.items.map(i=>i.tingkat).filter(Boolean))];
A.style.setProperty('--c',s.warna);
A.innerHTML=`<div class="head"><div class="ic" style="--c:${s.warna}">${s.ikon}</div><div style="flex:1"><h2>${s.nama}</h2><p>${esc(s.penyusun)?'Penyusun: '+esc(s.penyusun):'Kisi-kisi soal'} · ${s.items.length?s.items.length+' indikator':'berupa gambar'}</p></div><button class="btn" onclick="go('')">← Kembali</button><a class="btn p" href="${s.pdf}" download>⬇ PDF</a><button class="btn" onclick="print()">🖨</button></div>
${s.items.length?`<div class="dist">${LV.map((l,k)=>`<div class="dc"><b>${c[l]}</b><small>${l}</small><i style="background:${LC[k]}"></i></div>`).join('')}</div>
<div class="sr"><input class="in" id="q" placeholder="🔍 Cari di ${s.nama}…" autocomplete="off"></div>
<div class="tabs" id="f1"><button class="chip on" data-k="l" data-v="">Semua</button>${LV.filter(l=>c[l]).map(l=>`<button class="chip" data-k="l" data-v="${l}">${l}</button>`).join('')}${tks.map(t=>`<button class="chip" data-k="t" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>
${mats.length>1?`<div class="tabs" id="f2"><button class="chip on" data-k="m" data-v="">Semua materi</button>${mats.map(m=>`<button class="chip" data-k="m" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div>`:''}
<div class="list" id="ls"></div>`:`<div class="imgs">${s.gambar.map(g=>`<img src="${g}" loading="lazy" alt="Kisi ${s.nama}" onclick="zoom(this.src)">`).join('')}</div>`}`;
if(!s.items.length)return;
st.q=st.l=st.t=st.m='';
const ls=document.getElementById('ls'),q=document.getElementById('q');
const draw=()=>{const qq=st.q.toLowerCase();const r=s.items.filter(i=>(!st.l||lv(i)===st.l)&&(!st.t||i.tingkat===st.t)&&(!st.m||i.materi===st.m)&&(!qq||(i.indikator+' '+i.materi+' '+i.kompetensi).toLowerCase().includes(qq)));
ls.innerHTML=r.length?r.map(i=>item(s,i,st.q,false)).join(''):'<div class="empty">Tidak ada hasil 😕</div>'};
q.oninput=()=>{st.q=q.value.trim();draw()};
A.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k;st[k]=b.dataset.v;if(k!=='m'){st.l=k==='l'?b.dataset.v:'';st.t=k==='t'?b.dataset.v:''}
b.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));draw()});
draw()}
function zoom(u){const l=document.getElementById('lb');document.getElementById('lbi').src=u;l.classList.add('o')}
document.getElementById('lb').onclick=e=>e.currentTarget.classList.remove('o');
function go(h){location.hash=h}
function route(){const h=location.hash.slice(1);window.scrollTo(0,0);h?subj(h):home()}
addEventListener('hashchange',route);
const th=document.getElementById('th');
const setT=t=>{document.documentElement.dataset.t=t;th.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('kt',t)}catch(e){}};
let t0;try{t0=localStorage.getItem('kt')}catch(e){}
setT(t0||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
th.onclick=()=>setT(document.documentElement.dataset.t==='dark'?'light':'dark');
const fab=document.getElementById('fab');
addEventListener('scroll',()=>fab.classList.toggle('s',scrollY>500));
fab.onclick=()=>scrollTo({top:0,behavior:'smooth'});
route();
</script>
</body>
</html>
